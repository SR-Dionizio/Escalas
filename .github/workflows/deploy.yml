name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-08b116a183890b384

jobs:

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application
        run: |
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          echo "Deploying to instance: $INSTANCE_ID"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Escalas" \
            --parameters '{
              "commands":[
                "set -e",
                "echo \"[1/10] Stopping existing container...\"",
                "sudo docker stop escalas || true",
                "sudo docker rm escalas || true",
                "echo \"[2/10] Cleaning old files...\"",
                "sudo rm -rf /opt/escalas",
                "echo \"[3/10] Cloning repository...\"",
                "sudo git clone https://github.com/SR-Dionizio/Escalas.git /opt/escalas",
                "cd /opt/escalas",
                "echo \"[4/10] Building Docker image...\"",
                "sudo docker build -t escalas:latest . || { echo \"Docker build failed!\"; exit 1; }",
                "echo \"[5/10] Creating data directory...\"",
                "sudo mkdir -p /opt/escalas-data",
                "echo \"[6/10] Starting container...\"",
                "sudo docker run -d --restart unless-stopped --name escalas -p 8000:8000 -e DATABASE_PATH=/app-data/escalas.db -v /opt/escalas-data:/app-data escalas:latest || { echo \"Container start failed!\"; exit 1; }",
                "echo \"[7/10] Ensuring Nginx and Certbot are installed...\"",
                "sudo dnf install -y nginx certbot python3-certbot-nginx",
                "echo \"[8/10] Configuring Nginx if not configured...\"",
                "if [ ! -f /etc/nginx/conf.d/escalas.conf ]; then",
                "    sudo tee /etc/nginx/conf.d/escalas.conf > /dev/null <<\"NGINX_EOF\"",
                "server {",
                "    listen 80;",
                "    listen [::]:80;",
                "    server_name escalas.click www.escalas.click;",
                "",
                "    location / {",
                "        proxy_pass http://localhost:8000;",
                "        proxy_set_header Host \\$host;",
                "        proxy_set_header X-Real-IP \\$remote_addr;",
                "        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;",
                "        proxy_set_header X-Forwarded-Proto \\$scheme;",
                "    }",
                "}",
                "NGINX_EOF",
                "fi",
                "if [ -f /etc/letsencrypt/live/escalas.click/fullchain.pem ]; then",
                "    sudo certbot --nginx --reinstall --redirect --non-interactive --agree-tos -m admin@escalas.click -d escalas.click -d www.escalas.click || true",
                "else",
                "    sudo certbot --nginx --redirect --non-interactive --agree-tos -m admin@escalas.click -d escalas.click -d www.escalas.click || true",
                "fi",
                "echo \"[9/10] Testing and reloading Nginx...\"",
                "sudo nginx -t",
                "sudo systemctl restart nginx",
                "sudo systemctl enable nginx",
                "sudo systemctl enable certbot-renew.timer || true",
                "sudo systemctl start certbot-renew.timer || true",
                "echo \"[10/10] Checking services...\"",
                "sudo docker ps | grep escalas || { echo \"Container not running!\"; exit 1; }",
                "sudo systemctl is-active nginx || { echo \"Nginx not running!\"; exit 1; }",
                "echo \"Deployment completed successfully!\"",
                "echo \"URL: https://escalas.click\""
              ]
            }' \
            --query "Command.CommandId" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
          echo "Command ID: $COMMAND_ID"

      - name: Wait for completion
        run: |
          echo "Waiting for deployment to complete..."
          sleep 40

      - name: Get execution result
        id: get_result
        run: |
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}")
          
          echo "$RESULT" | jq '.'
          
          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "stdout<<EOF" >> $GITHUB_OUTPUT
          echo "$STDOUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "stderr<<EOF" >> $GITHUB_OUTPUT
          echo "$STDERR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display deployment logs
        run: |
          echo "=== DEPLOYMENT STATUS ==="
          echo "${{ steps.get_result.outputs.status }}"
          echo ""
          echo "=== STANDARD OUTPUT ==="
          echo "${{ steps.get_result.outputs.stdout }}"
          echo ""
          echo "=== STANDARD ERROR ==="
          echo "${{ steps.get_result.outputs.stderr }}"

      - name: Validate deployment
        run: |
          STATUS="${{ steps.get_result.outputs.status }}"
          
          echo "Final deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment FAILED!"
            echo "Check the logs above for details."
            exit 1
          fi

          echo "Deployment completed successfully!"
